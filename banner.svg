<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>

  <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00c6ff"/>
    <stop offset="100%" stop-color="#0072ff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="300" rx="20" fill="url(#bg)"/>

<!-- Decorative grid -->

<g opacity="0.08" stroke="#ffffff">

<line x1="0" y1="50" x2="1200" y2="50"/>
<line x1="0" y1="100" x2="1200" y2="100"/>
<line x1="0" y1="150" x2="1200" y2="150"/>
<line x1="0" y1="200" x2="1200" y2="200"/>
<line x1="0" y1="250" x2="1200" y2="250"/>

<line x1="100" y1="0" x2="100" y2="300"/>
<line x1="200" y1="0" x2="200" y2="300"/>
<line x1="300" y1="0" x2="300" y2="300"/>
<line x1="400" y1="0" x2="400" y2="300"/>
<line x1="500" y1="0" x2="500" y2="300"/>
<line x1="600" y1="0" x2="600" y2="300"/>
<line x1="700" y1="0" x2="700" y2="300"/>
<line x1="800" y1="0" x2="800" y2="300"/>
<line x1="900" y1="0" x2="900" y2="300"/>
<line x1="1000" y1="0" x2="1000" y2="300"/>
<line x1="1100" y1="0" x2="1100" y2="300"/>

</g>

<!-- Decorative circles -->

<circle cx="1040" cy="70" r="90"
     fill="none"
     stroke="#00c6ff"
     stroke-width="1"
     opacity="0.25"/>

<circle cx="1040" cy="70" r="60"
     fill="none"
     stroke="#0072ff"
     stroke-width="1"
     opacity="0.25"/>

<circle cx="1040" cy="70" r="30"
     fill="#00c6ff"
     opacity="0.08"/>

<!-- Main text -->

<text x="80" y="115"
   font-family="Arial, Helvetica, sans-serif"
   font-size="58"
   font-weight="700"
   fill="#ffffff">
JISS ABRAHAM </text>

<text x="84" y="155"
   font-family="Arial, Helvetica, sans-serif"
   font-size="21"
   letter-spacing="4"
   fill="#00c6ff">
COMPUTER SCIENCE • DATA ANALYTICS </text>

<line x1="84" y1="180" x2="500" y2="180"
   stroke="url(#line)"
   stroke-width="3"
   filter="url(#glow)"/>

<text x="84" y="220"
   font-family="Arial, Helvetica, sans-serif"
   font-size="18"
   fill="#9ca3af">
AI • DEVELOPMENT • DESIGN • DATA </text>

<text x="84" y="250"
   font-family="Arial, Helvetica, sans-serif"
   font-size="15"
   fill="#6b7280">
Always learning. Always building. </text>

<!-- Decorative code symbols -->

<text x="900" y="205"
   font-family="monospace"
   font-size="55"
   fill="#00c6ff"
   opacity="0.5">
</> </text>

</svg>
